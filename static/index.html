<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceRadar — Поиск выгодных цен</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 820px; margin: 40px auto; }
        .header { text-align: center; margin-bottom: 36px; }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #eff6ff;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 14px;
            border: 1px solid #bfdbfe;
        }
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; color: #0f172a; }
        .subtitle { color: var(--text-muted); font-size: 16px; }
        .search-wrapper {
            background: var(--card-bg);
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        input[type="text"] {
            flex: 1;
            border: none;
            padding: 14px 18px;
            font-size: 16px;
            outline: none;
            background: transparent;
        }
        button.search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button.search-btn:hover { background: var(--primary-hover); }
        .quick-tags {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 36px;
        }
        .tag {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .tag:hover { background: white; color: var(--primary); border-color: var(--primary); }
        .loader { display: none; text-align: center; padding: 40px 0; color: var(--text-muted); }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #cbd5e1; border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .section-title {
            font-size: 14px; font-weight: 700; text-transform: uppercase;
            color: var(--text-muted); margin: 24px 0 12px;
        }
        .card {
            background: var(--card-bg); border-radius: 16px; padding: 20px 24px;
            margin-bottom: 12px; display: flex; justify-content: space-between;
            align-items: center; gap: 16px; border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
        }
        .card.best-deal {
            border: 2px solid #10b981;
            background: linear-gradient(to right, #ffffff, #f0fdf4);
        }
        .badges { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .badge-wb { background: #f3e8ff; color: #7e22ce; }
        .badge-ozon { background: #dbeafe; color: #1d4ed8; }
        .badge-ym { background: #fef3c7; color: #b45309; }
        .badge-best {
            background: #10b981; color: white; padding: 4px 10px;
            border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase;
        }
        .title { font-size: 16px; font-weight: 600; color: var(--text-main); line-height: 1.4; }
        .price-block { text-align: right; min-width: 150px; flex-shrink: 0; }
        .price { font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
        .price-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .buy-btn {
            display: inline-block; padding: 10px 18px; border-radius: 10px;
            font-size: 14px; font-weight: 600; text-decoration: none; color: white;
        }
        .btn-wb { background: #9333ea; }
        .btn-ozon { background: #2563eb; }
        .btn-ym { background: #f59e0b; color: #0f172a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">⚡ Сравнение цен в реальном времени</div>
            <h1>Найдите товар дешевле</h1>
            <p class="subtitle">Мгновенный поиск выгодных предложений на Wildberries, Ozon и Яндекс Маркете</p>
        </div>

        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Введите название товара или бренд..." onkeypress="if(event.key==='Enter') search()">
            <button class="search-btn" onclick="search()">Найти</button>
        </div>

        <div class="quick-tags">
            <span class="tag" onclick="quickSearch('Наушники Sony')">Наушники Sony</span>
            <span class="tag" onclick="quickSearch('Игровая мышь Logitech')">Игровая мышь Logitech</span>
            <span class="tag" onclick="quickSearch('Кофемашина DeLonghi')">Кофемашина DeLonghi</span>
            <span class="tag" onclick="quickSearch('Кроссовки Nike')">Кроссовки Nike</span>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div>Сканируем цены на маркетплейсах...</div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        function quickSearch(text) {
            document.getElementById('searchInput').value = text;
            search();
        }

        async function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const loader = document.getElementById('loader');
            const resultsDiv = document.getElementById('results');

            loader.style.display = 'block';
            resultsDiv.innerHTML = '';

            try {
                const apiPath = ["", "api", "search"].join("/");
                const response = await fetch(apiPath + "?q=" + encodeURIComponent(query));
                const data = await response.json();
                loader.style.display = 'none';

                if (!data.items || data.items.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center; color:#64748b;">Ничего не найдено.</p>';
                    return;
                }

                const directItems = data.items.filter(item => item.is_direct);
                const linkItems = data.items.filter(item => !item.is_direct);

                let html = '';

                if (directItems.length > 0) {
                    html += '<div class="section-title">Найденные предложения с ценами</div>';
                    directItems.forEach((item, index) => {
                        html += renderCard(item, index === 0);
                    });
                }

                if (linkItems.length > 0) {
                    html += '<div class="section-title">Сравнить все предложения на площадках</div>';
                    linkItems.forEach(item => {
                        html += renderCard(item, false);
                    });
                }

                resultsDiv.innerHTML = html;
            } catch (error) {
                loader.style.display = 'none';
                resultsDiv.innerHTML = '<p style="text-align:center; color:#ef4444;">Ошибка соединения с сервером.</p>';
            }
        }

        function renderCard(item, isBest) {
            let badgeClass = 'badge-wb';
            let btnClass = 'btn-wb';

            if (item.marketplace === 'Ozon') {
                badgeClass = 'badge-ozon';
                btnClass = 'btn-ozon';
            } else if (item.marketplace === 'Яндекс Маркет') {
                badgeClass = 'badge-ym';
                btnClass = 'btn-ym';
            }

            const bestBadge = isBest ? '<span class="badge-best">🔥 Выгоднее всего</span>' : '';
            const cardClass = isBest ? 'card best-deal' : 'card';

            const priceHtml = item.is_direct
                ? `<div class="price">${item.price.toLocaleString('ru-RU')} ₽</div>`
                : `<div class="price-sub">Отсортировано по цене</div>`;

            return `
                <div class="${cardClass}">
                    <div>
                        <div class="badges">
                            <span class="badge ${badgeClass}">${item.marketplace}</span>
                            ${bestBadge}
                        </div>
                        <div class="title">${item.title}</div>
                    </div>
                    <div class="price-block">
                        ${priceHtml}
                        <a href="${item.url}" target="_blank" class="buy-btn ${btnClass}">Открыть</a>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
